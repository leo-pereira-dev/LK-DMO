services:
  postgres:
    image: postgres:16
    container_name: dmo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dso}
      POSTGRES_USER: ${POSTGRES_USER:-dso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dso_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dmo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dso} -d ${POSTGRES_DB:-dso}"]
      interval: 10s
      timeout: 5s
      retries: 30

  pgloader:
    image: dimitri/pgloader:latest
    container_name: dmo-pgloader
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/pgloader.load:/work/pgloader.load:ro
    command: pgloader /work/pgloader.load

  account:
    container_name: dmo-pg-account
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Account.Host/DigitalWorldOnline.Account.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Account.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_AuthenticationServer__Address: 0.0.0.0
      DSO_AuthenticationServer__Port: ${ACCOUNT_INTERNAL_PORT:-17029}
      DSO_AuthenticationServer__Backlog: ${SERVER_BACKLOG:-5}
      DSO_AuthenticationServer__Hash: "true"
      DSO_CharacterServer__Address: ${CHARACTER_SERVER_ADDRESS:-127.0.0.1}
      DSO_CharacterServer__PublicPort: ${CHARACTER_PUBLIC_PORT:-17050}
    ports:
      - "${ACCOUNT_PORT:-17029}:${ACCOUNT_INTERNAL_PORT:-17029}"
    restart: unless-stopped

  character:
    container_name: dmo-pg-character
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Character.Host/DigitalWorldOnline.Character.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Character.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_CharacterServer__Address: 0.0.0.0
      DSO_CharacterServer__Port: ${CHARACTER_INTERNAL_PORT:-17050}
      DSO_CharacterServer__Backlog: ${SERVER_BACKLOG:-5}
      DSO_GameServer__Address: ${GAME_SERVER_ADDRESS:-127.0.0.1}
      DSO_GameServer__Port: ${GAME_INTERNAL_PORT:-17608}
      DSO_GameServer__PublicPort: ${GAME_PUBLIC_PORT:-17608}
    ports:
      - "${CHARACTER_PORT:-17050}:${CHARACTER_INTERNAL_PORT:-17050}"
    volumes:
      - ./Bins:/app/Bins:ro
    restart: unless-stopped

  game:
    container_name: dmo-pg-game
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Game.Host/DigitalWorldOnline.Game.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Game.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_GameServer__Address: 0.0.0.0
      DSO_GameServer__Port: ${GAME_INTERNAL_PORT:-17608}
      DSO_GameServer__Backlog: ${SERVER_BACKLOG:-5}
      DSO_GameServer__PublicAddress: ${GAME_PUBLIC_ADDRESS:-127.0.0.1}
      DSO_GameServer__PublicPort: ${GAME_PUBLIC_PORT:-17608}
      DSO_Fatigue__Enabled: ${DSO_FATIGUE_ENABLED:-false}
    ports:
      - "${GAME_PORT:-17608}:${GAME_INTERNAL_PORT:-17608}"
    volumes:
      - ./Bins:/app/Bins:ro
      - ./xml:/app/xml:ro
    restart: unless-stopped

  routine:
    container_name: dmo-pg-routine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Routine.Host/DigitalWorldOnline.Routine/DigitalWorldOnline.Routine.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Routine.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
    volumes:
      - ./Bins:/app/Bins:ro
      - ./xml:/app/xml:ro
    restart: unless-stopped

  api:
    container_name: dmo-pg-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Account.Api/DigitalWorldOnline.Api.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Api.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${API_INTERNAL_PORT:-5189}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
    ports:
      - "${API_PORT:-15189}:${API_INTERNAL_PORT:-5189}"
    restart: unless-stopped

  admin:
    container_name: dmo-pg-admin
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Source/Distribution/DigitalWorldOnline.Admin/DigitalWorldOnline.Admin.csproj
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DLL: DigitalWorldOnline.Admin.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${ADMIN_INTERNAL_PORT:-5000}
      Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
      DSO_Database__Connection: ${DMO_DATABASE_CONNECTION:-Host=postgres;Port=5432;Database=dso;Username=dso;Password=dso_password;Search Path=dso;}
    ports:
      - "${ADMIN_PORT:-15000}:${ADMIN_INTERNAL_PORT:-5000}"
    volumes:
      - ./Bins:/app/Bins:ro
    restart: unless-stopped

volumes:
  dmo_postgres_data:
